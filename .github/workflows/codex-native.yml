name: Codex native qualification
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Optional JSON matrix include list (empty runs all six targets)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets || '[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc.exe"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc.exe"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev libfontconfig1-dev xvfb
      - name: Install qualified test runtime
        shell: bash
        run: |
          runtime_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then runtime_temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          cd "$runtime_temp"
          mkdir -p wordcraft-codex
          curl --fail --location --retry 3 "https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-${{ matrix.target }}.tar.gz" -o codex.tar.gz
          tar -xzf codex.tar.gz -C wordcraft-codex
          binary="$runtime_temp/wordcraft-codex/codex-${{ matrix.target }}"
          "$binary" --version
          if [ "$RUNNER_OS" = Windows ]; then binary="$(cygpath -w "$binary")"; fi
          echo "WORDCRAFT_CODEX_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Lifecycle and preference checks
        run: |
          cargo test --locked -p wordcraft-assistant --features test-support
          cargo test --locked -p wordcraft --bin wordcraft codex_settings
      - name: Actual runtime document relay
        run: cargo test --locked -p wordcraft --test codex_bridge -- --ignored
      - name: Native window smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --locked -p wordcraft --test codex_platform -- --ignored
          else
            cargo test --locked -p wordcraft --test codex_platform -- --ignored
          fi
